num_workers: 4
num_envs_per_worker: 1
rollout_fragment_length: 5
train_batch_size_per_learner: 100
sgd_minibatch_size: 40
num_sgd_iter: 10
lr: 3.0e-4
gamma: 0.99
lambda: 0.95
clip_param: 0.2
kl_coeff: 0.2
kl_target: 0.02
vf_clip_param: 10.0
vf_loss_coeff: 0.5
grad_clip: 0.5
entropy_coeff_schedule:
  - [0, 0.05]
  - [15000, 0.005]
batch_mode: complete_episodes
observation_filter: MeanStdFilter
sample_timeout_s: 1800
seed: 42
model:
  # obs_size = 2*2 metrics + 4 params + 2 worst_corner = 10
  fcnet_hiddens:
    - 256
    - 256
  fcnet_activation: relu
  vf_share_layers: false
env_config:
  engine: ngspice
  finger_mode: true
  finger_step: 120e-9
  map_config_path: autochaos/configs/map_config_3t_noinject.yaml
  model_file: ptm22lp.lib
  ngspice_bin: "ngspice"  # or full path, e.g. C:\ngspice\Spice64\bin\ngspice.exe on Windows
  ngspice_timeout: 30
  ngspice_retries: 1
  cache_wait_s: 60
  lambda_a: 0.0
  A_max: 1000000
  adaptive_beta: 0.97
  adaptive_delta_min: 1
  adaptive_delta_max: 10
  progressive_penalty: 0.1
  max_workers: 3
  max_episode_steps: 5
  generalize: false
  lhs_pool_path: runs/lhs_pool.json
  lhs_M: 500
  lhs_N: 50
  lhs_workers: 1
  sample_timeout_s: 1800


















